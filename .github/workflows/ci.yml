name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm test

  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exact-pinned (save-exact) so the manifest value is the resolved version — no node_modules needed.
      - id: v
        shell: bash
        run: echo "value=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

  test-browser:
    runs-on: ubuntu-latest
    needs: [lint, build, playwright-version]
    # Browsers + system deps are baked into the image, so there is no per-run install/apt cost.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.value }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run test:browser

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, build, playwright-version]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.value }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  depcruise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run depcruise

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm run build:webapp
      - run: npm run check:build -w apps/webapp
      - run: npm run build:vscode

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run format:check

  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  vscode-smoke:
    uses: ./.github/workflows/vscode-smoke.yml

  # The one required check: it needs every other job, so a new job counts only once it is in this
  # list. always() makes it report when a job it needs failed, was cancelled or was skipped because
  # a job before it failed; GitHub treats a skipped required check as passed.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - lint
      - test
      - playwright-version
      - test-browser
      - e2e
      - depcruise
      - build
      - format-check
      - pin-check
      - dependency-review
      - vscode-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every job passed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Jobs whose own if: skips them on this event by design: dependency-review needs a pull
          # request's base to compare with. Any other skip hides a failure.
          SKIPPED_BY_DESIGN: ${{ github.event_name != 'pull_request' && 'dependency-review' || '' }}
        run: |
          set -euo pipefail
          results=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          if [ -z "$results" ]; then
            echo "::error::ci-ok got no job results"
            exit 1
          fi
          failed=0
          while read -r job result; do
            if [ "$result" = success ]; then
              continue
            fi
            if [ "$result" = skipped ] && [[ " $SKIPPED_BY_DESIGN " == *" $job "* ]]; then
              echo "$job: skipped by design"
              continue
            fi
            echo "::error::$job: $result"
            failed=1
          done <<< "$results"
          exit "$failed"
